# For a NEW dedicated sandbox: nemoclaw onboard --name nemodoc --agents ./deploy/nemoclaw/agents.yaml
# Both agents inherit the inference provider/model selected during onboarding.
# Do not mount NemoDoc's repository, data directory, Docker socket or credentials.
main:
  tools:
    profile: minimal
    deny: [gateway, session_status]
agents:
  - id: nemodoc
    description: "NemoDoc evidence assistant; application tools are supplied over HTTP."
    tools:
      profile: minimal
      deny:
        - gateway
        - group:runtime
        - group:fs
        - group:messaging
        - group:sessions
        - group:memory
        - group:web
        - group:ui
        - group:automation
        - group:nodes
        - group:agents
        - group:media
        - group:plugins
